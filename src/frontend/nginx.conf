# Meetup links (/plan?g=<id>) hold people's starting points: never let them be indexed.
map $arg_g $robots_tag {
    ""      "";
    default "noindex, nofollow";
}

# Hashed build assets can be cached forever; everything else is revalidated.
map $uri $cache_control {
    ~^/static/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # All headers are set here, once. (nginx drops server-level add_header
    # in any location that has its own, so locations below add none.)
    add_header X-Robots-Tag $robots_tag always;
    add_header Cache-Control $cache_control always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # API goes to the FastAPI service (which sends its own X-Robots-Tag: noindex).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The landing page lives at "/", the app at "/plan". Old meetup links
    # (/?g=<id>) move to the app. Unknown paths get a real 404, not the app
    # (avoids "soft 404" duplicate pages in search results).
    location = / {
        if ($arg_g) { return 302 /plan?g=$arg_g; }
        try_files /index.html =404;
    }
    location = /plan {
        try_files /plan/index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # In production, also redirect www <-> apex and HTTP -> HTTPS at the load
    # balancer so only one origin serves the site.
}
