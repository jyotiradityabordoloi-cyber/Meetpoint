# Full stack: PostgreSQL 16 + API + web (Nginx serving the SPA and proxying /api).
#   cd src
#   GOOGLE_MAPS_API_KEY=your-key docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meetpoint
      POSTGRES_PASSWORD: meetpoint
      POSTGRES_DB: meetpoint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://meetpoint:meetpoint@db:5432/meetpoint
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${SITE_URL:-}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
